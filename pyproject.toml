# The workspace root. It is not a distribution anyone installs -- it exists so `uv`
# has one project to resolve the dev environment and the tooling config against
# (the installable pieces are `laboratory_model/`, `laboratory-client/`, `instruments/`
# and the servers, each with its own pyproject). The name and version are therefore local identity only;
# `version` is kept as a placeholder because the repository is versioned by git tag
# (v0.3.0 at the time of writing), not by this field.
[project]
name = "ofplang-sila2-backend"
version = "0.1.0"
description = "A virtual laboratory of mock SiLA2 instrument servers over a shared world-state service."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sila2[codegen]>=0.14.0",
]

# Development-only dependencies. `uv run` installs this group by default, so `uv run pytest`
# needs no extra flags. `httpx` is not imported by the tests directly -- it is what backs
# FastAPI's TestClient -- and `fastapi` is here because the tests exercise the laboratory
# model in process instead of talking to its container.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "ruff>=0.16",
    "mypy>=1.11",
    # The laboratory model reads its seed from YAML. Its own container gets PyYAML through
    # `uvicorn[standard]`, but the tests run in this environment, which does not.
    "pyyaml>=6.0",
    "types-pyyaml",
    # The LADS OPC UA servers' library, for the in-process tests of lads_common (they start a real
    # asyncua server and client). Pinned to 2.0.x for the same reason lads_common pins it.
    "asyncua>=2.0.1,<2.1",
]

[tool.pytest.ini_options]
# Tests live next to the component they cover (laboratory_model/tests/,
# laboratory-client/tests/, instruments/tests/, tools/tests/ and protocols/sila2/servers/<name>/tests/). A
# component whose tests import it contributes one entry here and one to `pythonpath`, which is
# what makes `import app...` or `import mock_instruments...` resolve without installing anything.
# The instrument behaviour in `instruments/` imports nothing from sila2 or asyncua, so its tests
# need neither a container nor a protocol library. `protocols/sila2/servers/ardea_mock_sila2/tests/` only reads
# files (the feature definitions), so it needs no path entry at all.
#
# A server directory shares a name with the package inside it, which the note below warns
# against -- but the trap does not apply there: a `protocols/sila2/servers/<name>/tests/` is imported as
# `protocols.sila2.servers.<name>.tests.<module>`, so it never claims the top-level package name.
#
# Note the hyphen in `laboratory-client`: a project directory must NOT be named after the
# package it contains. With --import-mode=importlib below, pytest derives a test module's
# name from its path relative to the root, so a `laboratory_client/tests/` would be imported
# as `laboratory_client.tests.<module>` -- registering the project directory itself as an
# empty namespace package under the name the real package needs, and every
# `from laboratory_client import ...` in the tests would then fail. Naming the directory
# after the distribution (`laboratory-client`) makes that collision impossible, since a
# hyphen cannot appear in a module name. `laboratory_model/` avoids the same trap by holding
# a package called `app`, and `instruments/` by holding one called `mock_instruments`.
testpaths = ["laboratory_model/tests", "laboratory-client/tests", "instruments/tests", "tools/tests", "protocols/sila2/servers/ardea_mock_sila2/tests", "protocols/lads/lads_common/tests", "protocols/lads/servers/tests"]
pythonpath = [
    "laboratory_model",
    "laboratory-client",
    "instruments",
    "protocols/lads/lads_common",
    "protocols/lads/servers/microplate_centrifuge_mock_lads",
    "protocols/lads/servers/automated_thermal_cycler_mock_lads",
    "protocols/lads/servers/plateloc_mock_lads",
    "protocols/lads/servers/automated_plate_seal_remover_mock_lads",
    "protocols/lads/servers/ardea_mock_lads",
    "tools",
]
# -ra summarises non-passing outcomes. --import-mode=importlib keeps test modules from
# colliding once several components have a tests/ directory holding same-named files.
addopts = "-ra --import-mode=importlib"

# Code the sila2 generator owns is regenerated wholesale, so it is not ours to style or
# type-check: the `generated/` trees, and each server's `__main__.py` entry point. All five
# copies of that entry point are byte-identical pure generator output, and the point of
# reading the laboratory-model settings straight from the environment (in laboratory_client)
# is to keep them that way -- they previously carried a hand-written block of CLI options,
# which contradicted this exclusion. Everything else -- the feature implementations,
# server.py, instruments/, laboratory_model/, laboratory-client/, samples/ and the tests -- is
# hand-written and is checked. Both tools below repeat this exclusion in their own syntax.
[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["**/generated", "**/__main__.py"]

[tool.ruff.lint]
# Same rule set as the sibling ofplang repos: pycodestyle (E/W), pyflakes (F), import
# order (I), pyupgrade (UP), bugbear (B), simplify (SIM) and comprehensions (C4).
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "W"]

[tool.ruff.lint.isort]
# None of these is installed into the dev environment, so ruff would otherwise file them
# under third-party: `app` is the laboratory model's own package, `laboratory_client` the
# shared HTTP client, `mock_instruments` the protocol-independent instrument behaviour the servers expose,
# `lads_common` and the `*_mock_lads` packages the LADS OPC UA runtime and servers,
# and `common` / `lads_client` the helper modules the sample scripts share. Declaring them keeps our imports in
# their own block.
known-first-party = [
    "app",
    "ardea_mock_lads",
    "automated_plate_seal_remover_mock_lads",
    "automated_thermal_cycler_mock_lads",
    "common",
    "laboratory_client",
    "lads_client",
    "lads_common",
    "microplate_centrifuge_mock_lads",
    "mock_instruments",
    "plateloc_mock_lads",
    "run_lads_roundabout",
    "run_roundabout",
    "slice_durations",
]

# Non-strict, like the sibling repos: the point is to catch real type errors, not to
# force annotations onto every function.
[tool.mypy]
python_version = "3.14"
files = ["laboratory_model", "laboratory-client", "instruments", "protocols", "samples", "tools"]
exclude = "(/generated/|__main__\\.py$)"
# The shared packages are not installed into the dev environment, so point mypy at the
# directories that hold them (mirroring pytest's `pythonpath` above); without this
# the servers' `from mock_instruments import ...` would be an unresolved import.
mypy_path = [
    "laboratory-client",
    "laboratory_model",
    "instruments",
    "protocols/lads/lads_common",
    "protocols/lads/servers/microplate_centrifuge_mock_lads",
    "protocols/lads/servers/automated_thermal_cycler_mock_lads",
    "protocols/lads/servers/plateloc_mock_lads",
    "protocols/lads/servers/automated_plate_seal_remover_mock_lads",
    "protocols/lads/servers/ardea_mock_lads",
    "tools",
]
# sila2, typer and uvicorn ship no stubs we depend on.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# `exclude` only keeps the generator's output from being crawled; it is still followed
# when our code imports it. Keep its types (our overrides are checked against them) but
# not its errors, which are the generator's to fix, not ours.
[[tool.mypy.overrides]]
module = ["*.generated.*"]
ignore_errors = true

# asyncua's annotations are not usable by a type checker: it types NodeId's arguments and
# QualifiedName's fields with its own wire-type aliases (Int32, String, Int16, ...), so passing a
# plain int or str -- which is what its own documentation does -- is reported everywhere, and its
# generated structures (ua.KeyValueType, ...) only exist at run time. Treat the library as untyped
# rather than scatter ignores through lads_common; our own code is still checked.
[[tool.mypy.overrides]]
module = ["asyncua", "asyncua.*"]
follow_imports = "skip"
