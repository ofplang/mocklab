  command: ["python", "-m", "ardea_lads", "--ip-address", "0.0.0.0", "--port", "4840", "--insecure", "--verbose"]

services:
  laboratory-model:
    build:
      context: ./laboratory_model
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      # The seed describes the whole world at t=0: which devices exist, which spots each has,
      # each device's resting state, and where anything already sits. Mounted read-only, and
      # reread by `POST /reseed` -- so editing it between runs takes effect without a rebuild.
      - LABORATORY_MODEL_SEED_FILE=/app/config/seed.yaml
    volumes:
      - ./config/laboratory_model.seed.yaml:/app/config/seed.yaml:ro

  # Each service lists its environment in full (see the note on the anchors above): the
  # server type and the laboratory-model wiring as well as the instance name, because setting
  # `environment:` here discards whatever the anchor declared. PYTHONUNBUFFERED is also set by
  # every Dockerfile; it is repeated here so the compose file shows the complete runtime
  # environment.
  #
  # LABORATORY_MODEL_LOCATION is the single location each instrument acts on -- for Ardea, the
  # spot an item occupies while being carried, which also tells that server which device's
  # state holds the machine light. These two used to be
  # `--laboratory-model-*` options on the command line; the environment was always where the
  # servers read them from, so passing them directly is what lets each `__main__.py` stay
  # pure generator output.
  sila2-server-1:
    <<: *microplate-centrifuge-server
    profiles: ["sila2"]
    ports:
      - "50052:50052"
    environment:
      - PYTHONUNBUFFERED=1
      - SILA_SERVER_TYPE=MicroplateCentrifugeServer
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=centrifuge.deck
      - SILA_SERVER_NAME=Agilent-Microplate-Centrifuge

  sila2-server-2:
    <<: *plateloc-server
    profiles: ["sila2"]
    ports:
      - "50053:50052"
    environment:
      - PYTHONUNBUFFERED=1
      - SILA_SERVER_TYPE=PlateLocServer
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=plateloc.stage
      - SILA_SERVER_NAME=Agilent-PlateLoc

  sila2-server-3:
    <<: *plate-seal-remover-server
    profiles: ["sila2"]
    ports:
      - "50054:50052"
    environment:
      - PYTHONUNBUFFERED=1
      - SILA_SERVER_TYPE=AutomatedPlateSealRemoverServer
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=seal-remover.stage
      - SILA_SERVER_NAME=Azenta-Automated-Plate-Seal-Remover

  sila2-server-4:
    <<: *thermal-cycler-server
    profiles: ["sila2"]
    ports:
      - "50055:50052"
    environment:
      - PYTHONUNBUFFERED=1
      - SILA_SERVER_TYPE=AutomatedThermalCyclerServer
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=thermal-cycler.block
      - SILA_SERVER_NAME=ThermoFisher-Thermal-Cycler

  # The station -- the workflow's entry and exit point -- has no service here. Its two slots
  # are declared by the seed and that is all a plain holding place needs: nothing about a rack
  # is commandable, so a real bench has no server for it either. Ardea reaches
  # `station.slot1` / `station.slot2` like any other station.

  # The transporter. `SILA_SERVER_TYPE` is the real machine's own server type rather than a
  # mock-specific name, because that is what a client looking for Ardea knows it by; the
  # server's description is where being a mock is stated. The published port is the one the
  # trolley arm used before it, so anything already pointed at the lab's transporter still
  # finds it -- what changed is the Feature it answers with.
  #
  # ARDEA_STATIONS is the station map: which of the machine's station names means which place in
  # this world. A workflow names stations, not locations, because that is what the real Ardea
  # takes -- so this variable is what lets a workflow written here be pointed at the machine.
  # It mirrors the real bench, where every station holds exactly one plate:
  #
  #     Base1, Base2   the two plain plate-holding stations
  #     Base3          peeler            (the seal remover)
  #     Base4          sealer            (PlateLoc)
  #     Base5          plate centrifuge
  #     Base6          thermal cycler
  #
  # The locations on the right must be spots the seed declares, and the map is read at startup:
  # editing it takes a `--force-recreate`, not a rebuild. See the ardea server's `stations.py`.
  ardea-server-1:
    <<: *ardea-server
    profiles: ["sila2"]
    ports:
      - "50057:50052"
    environment:
      - PYTHONUNBUFFERED=1
      - SILA_SERVER_TYPE=ArdeaSila2Server
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=ardea.gripper
      - SILA_SERVER_NAME=Ardea
      - ARDEA_STATIONS=Base1=station.slot1,Base2=station.slot2,Base3=seal-remover.stage,Base4=plateloc.stage,Base5=centrifuge.deck,Base6=thermal-cycler.block

  # --- LADS OPC UA servers. The same five, served over OPC UA with the LADS information model
  # --- instead of SiLA2 (`docs/LADS_MAPPING.md`), behind the `lads` profile.
  #
  # Each acts on the same world-model location as its SiLA2 counterpart and bakes in the same
  # durations, so the two protocols behave alike. Running both at once is possible -- they share
  # the one world -- but each has its own one-command-at-a-time guard, so nothing stops a SiLA2 and
  # a LADS client from driving the same instrument at the same time.
  lads-server-1:
    <<: *lads-microplate-centrifuge-server
    profiles: ["lads"]
    ports:
      - "4841:4840"
    environment:
      - PYTHONUNBUFFERED=1
      - LADS_SERVER_TYPE=MicroplateCentrifugeServer
      - LADS_SERVER_NAME=Agilent-Microplate-Centrifuge
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=centrifuge.deck

  lads-server-2:
    <<: *lads-plateloc-server
    profiles: ["lads"]
    ports:
      - "4842:4840"
    environment:
      - PYTHONUNBUFFERED=1
      - LADS_SERVER_TYPE=PlateLocServer
      - LADS_SERVER_NAME=Agilent-PlateLoc
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=plateloc.stage

  lads-server-3:
    <<: *lads-plate-seal-remover-server
    profiles: ["lads"]
    ports:
      - "4843:4840"
    environment:
      - PYTHONUNBUFFERED=1
      - LADS_SERVER_TYPE=AutomatedPlateSealRemoverServer
      - LADS_SERVER_NAME=Azenta-Automated-Plate-Seal-Remover
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=seal-remover.stage

  lads-server-4:
    <<: *lads-thermal-cycler-server
    profiles: ["lads"]
    ports:
      - "4844:4840"
    environment:
      - PYTHONUNBUFFERED=1
      - LADS_SERVER_TYPE=AutomatedThermalCyclerServer
      - LADS_SERVER_NAME=ThermoFisher-Thermal-Cycler
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=thermal-cycler.block

  # The transporter over LADS. Host port 4847 mirrors the SiLA2 Ardea's 50057 (the slot after the
  # four instruments is left free there too). The station map is the same as the SiLA2 Ardea's --
  # both name the same bench -- and, like it, is read at startup (`--force-recreate` to change it).
  ardea-lads-server-1:
    <<: *lads-ardea-server
    profiles: ["lads"]
    ports:
      - "4847:4840"
    environment:
      - PYTHONUNBUFFERED=1
      - LADS_SERVER_TYPE=ArdeaLadsServer
      - LADS_SERVER_NAME=Ardea
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=ardea.gripper
      - ARDEA_STATIONS=Base1=station.slot1,Base2=station.slot2,Base3=seal-remover.stage,Base4=plateloc.stage,Base5=centrifuge.deck,Base6=thermal-cycler.block
