syntax = "proto3";

import "SiLAFramework.proto";

package sila2.org.riken.instruments.automatedthermalcyclercontroller.v1;

/* A SiLA Server for controlling the Automated Thermal Cycler (ATC) made by Thermo Fisher Scientific. The Automated Thermal Cycler is a small, easy-to-integrate thermal cycler. It supports 96‑well and 0.2‑mL sample block configuration (compatible with full‑ or half‑skirted plates). Model number : A31487 Product URL : https://www.thermofisher.com/order/catalog/product/A31487 Firmware Version: v1.2.0 */
service AutomatedThermalCyclerController {
  /* 
      Load the protocol file.

      Calling this command invokes the instrument command load.

      Status required to execute this command: Idle
      Status while this command is running: Same as the status at the start of execution
      Status after this command finishes: Same as the status at the start of execution
     */
  rpc Load (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.Load_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of Load */
  rpc Load_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of Load */
  rpc Load_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.Load_Responses) {}
  /* 
      Validate the protocol file.

      Calling this command invokes the instrument command validate.

      Status required to execute this command: Idle
      Status while this command is running: Same as the status at the start of execution
      Status after this command finishes: Same as the status at the start of execution
     */
  rpc Validate (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.Validate_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of Validate */
  rpc Validate_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of Validate */
  rpc Validate_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.Validate_Responses) {}
  /* 
      Open the lid of the ATC.

      Calling this command invokes the instrument command openLid.

      Status required to execute this command: Idle
      Status while this command is running: Same as the status at the start of execution
      Status after this command finishes
        If it completes normally: Same as the status at the start of execution
        If an error occurs: Error
     */
  rpc OpenLid (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.OpenLid_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of OpenLid */
  rpc OpenLid_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of OpenLid */
  rpc OpenLid_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.OpenLid_Responses) {}
  /* 
      Close the lid of the ATC.

      Calling this command invokes the instrument command closeLid.

      Status required to execute this command: Idle
      Status while this command is running: Same as the status at the start of execution
      Status after this command finishes
        If it completes normally: Same as the status at the start of execution
        If an error occurs: Error
     */
  rpc CloseLid (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.CloseLid_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of CloseLid */
  rpc CloseLid_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of CloseLid */
  rpc CloseLid_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.CloseLid_Responses) {}
  /* 
      Start to run using the already loaded protocol file.
      Note: Execute the following commands in advance.
      * Load
      * Validate
      * Close Lid

      Calling this command invokes the instrument command startRun, getElapsedTime, getRemainingTime.

      Status required to execute this command: Idle
      Status while this command is running: Running
      Status after this command finishes
        If it completes normally: Running
        If an error occurs: Error
      Note: After the protocol finishes, the status is updated according to the result:
        Normal completion: Idle
        Error occurred: Error
     */
  rpc StartRun (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.StartRun_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of StartRun */
  rpc StartRun_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of StartRun */
  rpc StartRun_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.StartRun_Responses) {}
  /* 
      Stop running.
      If this command is sent when the instrument is not running, an error occurs.

      Calling this command invokes the instrument command stopRun.

      Status required to execute this command: Running
      Status while this command is running: Same as the status at the start of execution
      Status after this command finishes
        If it completes normally: Same as the status at the start of execution
        If an error occurs: Error
      Note: After stop running, the status is updated according to the result:
        Normal completion: Idle
        Error occurred: Error
     */
  rpc StopRun (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.StopRun_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of StopRun */
  rpc StopRun_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of StopRun */
  rpc StopRun_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.StopRun_Responses) {}
  /* Get the state of the instrument. Calling this command invokes the instrument command getInstrumentState. Status required to execute this command: Idle, Running, Error Status while this command is running: Same as the status at the start of execution Status after this command finishes If it completes normally: Same as the status at the start of execution If an error occurs: Error */
  rpc GetInstrumentState (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.GetInstrumentState_Parameters) returns (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.GetInstrumentState_Responses) {}
  /* 
      Reset the server to its Idle state. This command is common to all instruments.

      Calling this command invokes the instrument command stopRun.

      Status required to execute this command: Error
      Status while this command is running: Same as the status at the start of execution
      Status after this command finishes
        If it completes normally: Idle
        If an error occurs: Error
     */
  rpc Reset (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.Reset_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of Reset */
  rpc Reset_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of Reset */
  rpc Reset_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.Reset_Responses) {}
  /* 
      The elapsed time since the protocol started running, represented as a string in hh:mm:ss format.
      If the protocol is not running, the value is set to 00:00:00.
     */
  rpc Subscribe_ElapsedTime (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.Subscribe_ElapsedTime_Parameters) returns (stream sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.Subscribe_ElapsedTime_Responses) {}
  /* 
      The remaining time until the protocol completes, represented as a string in hh:mm:ss format.
      If the protocol is not running, the value is set to 00:00:00.

      Note: Until the protocol finishes, the value will not be set to 00:00:00.
      Instead, the value will stop at 00:00:01.
     */
  rpc Subscribe_RemainingTime (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.Subscribe_RemainingTime_Parameters) returns (stream sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.Subscribe_RemainingTime_Responses) {}
  /* 
      Returns the status of the instrument. This property is common to all instruments.
      0: Not Connected
      1: Idle
      2: Running
      3: Error
     */
  rpc Subscribe_Status (sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.Subscribe_Status_Parameters) returns (stream sila2.org.riken.instruments.automatedthermalcyclercontroller.v1.Subscribe_Status_Responses) {}
}

/* Parameters for Load */
message Load_Parameters {
  sila2.org.silastandard.Binary ProtocolFileData = 1;  /* Protocol file in binary form. The original protocol file is expected to be in XML format. Note: The file must be encoded in UTF-8. */
}

/* Responses of Load */
message Load_Responses {
}

/* Parameters for Validate */
message Validate_Parameters {
  sila2.org.silastandard.Real MaxSampleVolume = 1;  /* Upper limit of sample volume. If set to 0, the default value is used. */
}

/* Responses of Validate */
message Validate_Responses {
}

/* Parameters for OpenLid */
message OpenLid_Parameters {
}

/* Responses of OpenLid */
message OpenLid_Responses {
}

/* Parameters for CloseLid */
message CloseLid_Parameters {
}

/* Responses of CloseLid */
message CloseLid_Responses {
}

/* Parameters for StartRun */
message StartRun_Parameters {
}

/* Responses of StartRun */
message StartRun_Responses {
}

/* Parameters for StopRun */
message StopRun_Parameters {
}

/* Responses of StopRun */
message StopRun_Responses {
}

/* Parameters for GetInstrumentState */
message GetInstrumentState_Parameters {
}

/* Responses of GetInstrumentState */
message GetInstrumentState_Responses {
  sila2.org.silastandard.Integer InstrumentState = 1;  /* The state of the instrument. 0: IDLE 1: STANDBY 2: RUNNING 3: ERROR 4: DIAGNOSTICS */
}

/* Parameters for Reset */
message Reset_Parameters {
}

/* Responses of Reset */
message Reset_Responses {
}

/* Parameters for ElapsedTime */
message Subscribe_ElapsedTime_Parameters {
}

/* Responses of ElapsedTime */
message Subscribe_ElapsedTime_Responses {
  sila2.org.silastandard.String ElapsedTime = 1;  /* The elapsed time since the protocol started running, represented as a string in hh:mm:ss format. If the protocol is not running, the value is set to 00:00:00. */
}

/* Parameters for RemainingTime */
message Subscribe_RemainingTime_Parameters {
}

/* Responses of RemainingTime */
message Subscribe_RemainingTime_Responses {
  sila2.org.silastandard.String RemainingTime = 1;  /* The remaining time until the protocol completes, represented as a string in hh:mm:ss format. If the protocol is not running, the value is set to 00:00:00. Note: Until the protocol finishes, the value will not be set to 00:00:00. Instead, the value will stop at 00:00:01. */
}

/* Parameters for Status */
message Subscribe_Status_Parameters {
}

/* Responses of Status */
message Subscribe_Status_Responses {
  sila2.org.silastandard.Integer Status = 1;  /* Returns the status of the instrument. This property is common to all instruments. 0: Not Connected 1: Idle 2: Running 3: Error */
}
