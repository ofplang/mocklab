syntax = "proto3";

import "SiLAFramework.proto";

package sila2.jp.riken.bcap.taskservice.v1;

/* Run robot controller tasks (programs) by name on a DENSO robot controller over b-CAP, and list available task names. The server is stateless: each command opens a b-CAP connection, acquires the task handle, performs the operation, then releases the handle and disconnects. */
service TaskService {
  /* 
      Start a controller task in one-cycle mode (mode 1) by name and wait for it to
      finish. This is an observable command. After starting the task the command holds
      the b-CAP connection and polls the task execution status: it first waits for the
      task to enter the running state, then waits for it to leave that state. A clean
      one-cycle completion (status returns to ready) finishes the command successfully.
      If completion is not reached within the configured timeout, the task is stopped
      (initialized stop) and the command fails. The command stays free of connection and
      timing details; those are configured on the server.
     */
  rpc RunTask (sila2.jp.riken.bcap.taskservice.v1.RunTask_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of RunTask */
  rpc RunTask_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of RunTask */
  rpc RunTask_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.jp.riken.bcap.taskservice.v1.RunTask_Responses) {}
  /* List the names of all available controller tasks. */
  rpc GetTaskNames (sila2.jp.riken.bcap.taskservice.v1.GetTaskNames_Parameters) returns (sila2.jp.riken.bcap.taskservice.v1.GetTaskNames_Responses) {}
}

/* Parameters for RunTask */
message RunTask_Parameters {
  sila2.org.silastandard.String TaskName = 1;  /* The name of the controller task (program) to start. */
}

/* Responses of RunTask */
message RunTask_Responses {
  sila2.org.silastandard.Boolean Started = 1;  /* True if the task was started successfully. */
}

/* Parameters for GetTaskNames */
message GetTaskNames_Parameters {
}

/* Responses of GetTaskNames */
message GetTaskNames_Responses {
  repeated sila2.org.silastandard.String TaskNames = 1;  /* The list of controller task names. */
}
