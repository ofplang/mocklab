x-lads-ardea-server: &lads-ardea-server
  build:
    context: .
    dockerfile: protocols/lads/servers/ardea_lads/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
