syntax = "proto3";

import "SiLAFramework.proto";

package sila2.org.riken.instruments.plateloccontroller.v1;

/* A SiLA Server for controlling the PlateLoc made by Agilent Technologies. The PlateLoc is a fully automated laboratory heat sealer. The PlateLoc can apply various seals to various types of microplates. Model number: G5585B Product URL : https://www.chem-agilent.com/contents.php?id=1006101 VWorks ActiveX Control (version 13.1.0.1366 or later) is required on the computer running this SiLA Server. */
service PlateLocController {
  /* 
      Start a seal cycle.
      This command triggers the execution of steps moving stage in, applying seal, and moving stage out in sequence.
      If you call this command while another observable command is running, the request will be rejected.
      
      Calling this command invokes the instrument command StartCycle.

      Status required to execute this command: Idle
      Status while this command is running: Running
      Status after this command finishes
        If it completes normally: Idle
        If an error occurs: Error
     */
  rpc StartCycle (sila2.org.riken.instruments.plateloccontroller.v1.StartCycle_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of StartCycle */
  rpc StartCycle_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of StartCycle */
  rpc StartCycle_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.plateloccontroller.v1.StartCycle_Responses) {}
  /* 
      Terminate the seal cycle currently in progress.
      The following notes apply to this command:
      * This command may not work as intended because it is executed only after the StartCycle command has completed.
      * When the StopCycle process is executed, the seal cycle stops immediately, which may cause the seal roll to become slack. This condition can result in an error, so verify the seal roll status and take any required actions.
      - The StopCycle process can be executed via the GUI without waiting for the StartCycle command to complete.

      Calling this command invokes the instrument command StopCycle.

      Status required to execute this command: Running
      Status while this command is running: Same as the status at the start of execution
      Status after this command finishes
        If it completes normally: Idle
        If an error occurs: Error
     */
  rpc StopCycle (sila2.org.riken.instruments.plateloccontroller.v1.StopCycle_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of StopCycle */
  rpc StopCycle_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of StopCycle */
  rpc StopCycle_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.plateloccontroller.v1.StopCycle_Responses) {}
  /* Assign the specified parameter value as the seal-cycle duration (in seconds). Calling this command invokes the instrument command SetSealingTime. Status required to execute this command: Idle, Running Status while this command is running: Same as the status at the start of execution Status after this command finishes If it completes normally: Same as the status at the start of execution If an error occurs: Error */
  rpc SetSealingTime (sila2.org.riken.instruments.plateloccontroller.v1.SetSealingTime_Parameters) returns (sila2.org.riken.instruments.plateloccontroller.v1.SetSealingTime_Responses) {}
  /* Assign the specified parameter value as the sealing temperature (°C) of the hot plate. Calling this command invokes the instrument command SetSealingTemperature. Status required to execute this command: Idle, Running Status while this command is running: Same as the status at the start of execution Status after this command finishes If it completes normally: Same as the status at the start of execution If an error occurs: Error */
  rpc SetSealingTemperature (sila2.org.riken.instruments.plateloccontroller.v1.SetSealingTemperature_Parameters) returns (sila2.org.riken.instruments.plateloccontroller.v1.SetSealingTemperature_Responses) {}
  /* 
      Reset the server to its Idle state. This command is common to all instruments.
      If you call this command while another observable command is running, the request will be rejected.

      Calling this command invokes the instrument command Abort.

      Status required to execute this command: Error, Running
      Status while this command is running: Same as the status at the start of execution
      Status after this command finishes
        If it completes normally: Idle
        If an error occurs: Error
     */
  rpc Reset (sila2.org.riken.instruments.plateloccontroller.v1.Reset_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of Reset */
  rpc Reset_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of Reset */
  rpc Reset_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.riken.instruments.plateloccontroller.v1.Reset_Responses) {}
  /* Enumerate profiles for PlateLoc. Calling this command invokes the instrument command EnumerateProfiles. Status required to execute this command: Idle, Running Status while this command is running: Same as the status at the start of execution Status after this command finishes: Same as the status at the start of execution */
  rpc EnumerateProfiles (sila2.org.riken.instruments.plateloccontroller.v1.EnumerateProfiles_Parameters) returns (sila2.org.riken.instruments.plateloccontroller.v1.EnumerateProfiles_Responses) {}
  /* 
      Get the sealing temperature (°C) currently set by the user.

      Reading this property invokes the instrument command GetSealingTemperature.

      Status required to get this property: Idle, Running
     */
  rpc Get_SealingTemperature (sila2.org.riken.instruments.plateloccontroller.v1.Get_SealingTemperature_Parameters) returns (sila2.org.riken.instruments.plateloccontroller.v1.Get_SealingTemperature_Responses) {}
  /* 
      Get the sealing time currently set by the user.

      Reading this property invokes the instrument command GetSealingTime.

      Status required to get this property: Idle, Running
     */
  rpc Get_SealingTime (sila2.org.riken.instruments.plateloccontroller.v1.Get_SealingTime_Parameters) returns (sila2.org.riken.instruments.plateloccontroller.v1.Get_SealingTime_Responses) {}
  /* 
      Actual temperature (°C) of the hot plate.

      Reading this property invokes the instrument command GetActualTemperature.

      Status required to get this property: Idle, Running
     */
  rpc Get_ActualTemperature (sila2.org.riken.instruments.plateloccontroller.v1.Get_ActualTemperature_Parameters) returns (sila2.org.riken.instruments.plateloccontroller.v1.Get_ActualTemperature_Responses) {}
  /* 
      The count of seal cycles performed.

      Reading this property invokes the instrument command GetCycleCount.

      Status required to get this property: Idle, Running
     */
  rpc Get_CycleCount (sila2.org.riken.instruments.plateloccontroller.v1.Get_CycleCount_Parameters) returns (sila2.org.riken.instruments.plateloccontroller.v1.Get_CycleCount_Responses) {}
  /* 
      The firmware version of the instrument.

      Reading this property invokes the instrument command GetFirmwareVersion.

      Status required to get this property: Idle, Running
     */
  rpc Get_FirmwareVersion (sila2.org.riken.instruments.plateloccontroller.v1.Get_FirmwareVersion_Parameters) returns (sila2.org.riken.instruments.plateloccontroller.v1.Get_FirmwareVersion_Responses) {}
  /* 
      The version number of the PlateLoc ActiveX Control.

      Reading this property invokes the instrument command GetVersion.

      Status required to get this property: Idle, Running
     */
  rpc Get_Version (sila2.org.riken.instruments.plateloccontroller.v1.Get_Version_Parameters) returns (sila2.org.riken.instruments.plateloccontroller.v1.Get_Version_Responses) {}
  /* 
      Returns the status of the instrument. This property is common to all instruments.
      0: Not Connected
      1: Idle
      2: Running
      3: Error
     */
  rpc Subscribe_Status (sila2.org.riken.instruments.plateloccontroller.v1.Subscribe_Status_Parameters) returns (stream sila2.org.riken.instruments.plateloccontroller.v1.Subscribe_Status_Responses) {}
}

/* Parameters for StartCycle */
message StartCycle_Parameters {
}

/* Responses of StartCycle */
message StartCycle_Responses {
}

/* Parameters for StopCycle */
message StopCycle_Parameters {
}

/* Responses of StopCycle */
message StopCycle_Responses {
}

/* Parameters for SetSealingTime */
message SetSealingTime_Parameters {
  sila2.org.silastandard.Real SealingTime = 1;  /* The value to be set as sealing time. */
}

/* Responses of SetSealingTime */
message SetSealingTime_Responses {
}

/* Parameters for SetSealingTemperature */
message SetSealingTemperature_Parameters {
  sila2.org.silastandard.Integer SealingTemperature = 1;  /* The value to be set as sealing temperature. */
}

/* Responses of SetSealingTemperature */
message SetSealingTemperature_Responses {
}

/* Parameters for Reset */
message Reset_Parameters {
}

/* Responses of Reset */
message Reset_Responses {
}

/* Parameters for EnumerateProfiles */
message EnumerateProfiles_Parameters {
}

/* Responses of EnumerateProfiles */
message EnumerateProfiles_Responses {
  repeated sila2.org.silastandard.String ProfileNames = 1;  /* The names of the profiles. */
}

/* Parameters for SealingTemperature */
message Get_SealingTemperature_Parameters {
}

/* Responses of SealingTemperature */
message Get_SealingTemperature_Responses {
  sila2.org.silastandard.Integer SealingTemperature = 1;  /* Get the sealing temperature (°C) currently set by the user. Reading this property invokes the instrument command GetSealingTemperature. Status required to get this property: Idle, Running */
}

/* Parameters for SealingTime */
message Get_SealingTime_Parameters {
}

/* Responses of SealingTime */
message Get_SealingTime_Responses {
  sila2.org.silastandard.Real SealingTime = 1;  /* Get the sealing time currently set by the user. Reading this property invokes the instrument command GetSealingTime. Status required to get this property: Idle, Running */
}

/* Parameters for ActualTemperature */
message Get_ActualTemperature_Parameters {
}

/* Responses of ActualTemperature */
message Get_ActualTemperature_Responses {
  sila2.org.silastandard.Integer ActualTemperature = 1;  /* Actual temperature (°C) of the hot plate. Reading this property invokes the instrument command GetActualTemperature. Status required to get this property: Idle, Running */
}

/* Parameters for CycleCount */
message Get_CycleCount_Parameters {
}

/* Responses of CycleCount */
message Get_CycleCount_Responses {
  sila2.org.silastandard.Integer CycleCount = 1;  /* The count of seal cycles performed. Reading this property invokes the instrument command GetCycleCount. Status required to get this property: Idle, Running */
}

/* Parameters for FirmwareVersion */
message Get_FirmwareVersion_Parameters {
}

/* Responses of FirmwareVersion */
message Get_FirmwareVersion_Responses {
  sila2.org.silastandard.String FirmwareVersion = 1;  /* The firmware version of the instrument. Reading this property invokes the instrument command GetFirmwareVersion. Status required to get this property: Idle, Running */
}

/* Parameters for Version */
message Get_Version_Parameters {
}

/* Responses of Version */
message Get_Version_Responses {
  sila2.org.silastandard.String Version = 1;  /* The version number of the PlateLoc ActiveX Control. Reading this property invokes the instrument command GetVersion. Status required to get this property: Idle, Running */
}

/* Parameters for Status */
message Subscribe_Status_Parameters {
}

/* Responses of Status */
message Subscribe_Status_Responses {
  sila2.org.silastandard.Integer Status = 1;  /* Returns the status of the instrument. This property is common to all instruments. 0: Not Connected 1: Idle 2: Running 3: Error */
}
