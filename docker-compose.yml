# WHICH PROTOCOL. The same mock instruments are served over SiLA2 (profile `sila2`) and over
# LADS OPC UA (profile `lads`); the laboratory model has no profile and always starts. Choose
# with `--profile sila2`, `--profile lads` or both, or set COMPOSE_PROFILES -- copying
# `.env.example` to `.env` makes `sila2` the default, so a plain `docker compose up` starts the
# SiLA2 lab. Without either, only the laboratory model starts. `docker compose --profile "*" down`
# stops everything whatever was started (`down` otherwise only touches the active profiles).
#
# Shared per-instrument definitions. NOTE: these anchors deliberately carry NO
# `environment:` key. A service that sets `environment:` REPLACES the anchor's list
# wholesale -- YAML merge keys (`<<:`) merge mappings but never deep-merge lists -- so
# every variable a container needs is listed on the service itself below. Splitting them
# between anchor and service silently drops the anchor's half.
x-ardea-server: &ardea-server
  build:
    context: .
    dockerfile: protocols/sila2/servers/ardea_server/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "ardea_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose"]

x-microplate-centrifuge-server: &microplate-centrifuge-server
  build:
    context: .
    dockerfile: protocols/sila2/servers/microplate_centrifuge_server/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "microplate_centrifuge_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose"]

x-plateloc-server: &plateloc-server
  build:
    context: .
    dockerfile: protocols/sila2/servers/plateloc_server/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "plateloc_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose"]

x-plate-seal-remover-server: &plate-seal-remover-server
  build:
    context: .
    dockerfile: protocols/sila2/servers/automated_plate_seal_remover_server/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "automated_plate_seal_remover_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose"]

x-thermal-cycler-server: &thermal-cycler-server
  build:
    context: .
    dockerfile: protocols/sila2/servers/automated_thermal_cycler_server/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "automated_thermal_cycler_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose"]

# The LADS OPC UA servers of the same instruments (the `lads` profile, below). Same build context
# and duration profile as the SiLA2 anchors above; OPC UA's registered port 4840 inside.
x-lads-microplate-centrifuge-server: &lads-microplate-centrifuge-server
  build:
    context: .
    dockerfile: protocols/lads/servers/microplate_centrifuge_lads/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "microplate_centrifuge_lads", "--ip-address", "0.0.0.0", "--port", "4840", "--insecure", "--verbose"]

x-lads-plateloc-server: &lads-plateloc-server
  build:
    context: .
    dockerfile: protocols/lads/servers/plateloc_lads/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "plateloc_lads", "--ip-address", "0.0.0.0", "--port", "4840", "--insecure", "--verbose"]

x-lads-plate-seal-remover-server: &lads-plate-seal-remover-server
  build:
    context: .
    dockerfile: protocols/lads/servers/automated_plate_seal_remover_lads/Dockerfile
